<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Emily &amp; Matthias</title>
<style>
/* The door: a single quiet card in the invitation's colours. The real page is stored encrypted in site.enc
   and is only opened with the password (carried by the QR code after the # in the address). */
:root{--ground:#e6e3dd;--paper:#fcfbf7;--ink:#2b2724;--ink-soft:#6f675f;--rule:#d9d2c8;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"EB Garamond","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-text-size-adjust:100%}
.card{width:100%;max-width:420px;background:var(--paper);padding:clamp(34px,8vw,52px) clamp(22px,7vw,44px);text-align:center;
  box-shadow:0 1px 2px rgb(70 52 40 / .08),0 10px 28px rgb(70 52 40 / .10)}
h1{font-weight:400;font-size:clamp(2rem,1.4rem + 3.6vw,2.7rem);line-height:1.05;margin:0 0 .5em;letter-spacing:-.01em}
h1 i{font-style:italic}
p{margin:0;line-height:1.5;color:var(--ink-soft);font-size:1.05rem}
p + p{margin-top:.5em}
form{margin-top:26px;display:grid;gap:16px}
label{font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft)}
input{width:100%;font:inherit;font-size:max(1.1rem,16px);text-align:center;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--ink-soft);
  padding:8px 0;border-radius:0;-webkit-appearance:none;appearance:none}
input:focus{outline:none;border-color:var(--ink)}
button{font:500 .76rem/1 inherit;font-family:inherit;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);background:var(--ink);border:1px solid var(--ink);
  padding:14px 22px 13px;border-radius:0;cursor:pointer;justify-self:center}
button:focus-visible,input:focus-visible{outline:1.5px solid var(--ink);outline-offset:4px}
.msg{min-height:1.5em;font-style:italic;color:#8c3b2e;font-size:1rem}
.wait{font-style:italic}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <h1>Emily <i>&amp;</i> Matthias</h1>
  <p class="wait" id="wait">Opening … / Einen Moment …</p>
  <div id="gate" hidden>
    <p>Please scan the QR code on your invitation, or enter the password.</p>
    <p>Bitte scannt den QR-Code auf eurer Einladung oder gebt das Passwort ein.</p>
    <form id="f" autocomplete="off">
      <label for="pw">Password / Passwort</label>
      <input id="pw" type="text" inputmode="text" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" required>
      <p class="msg" id="msg" role="alert"></p>
      <button type="submit">Open / Öffnen</button>
    </form>
  </div>
  <noscript><p>This page needs JavaScript. / Diese Seite benötigt JavaScript.</p></noscript>
</main>
<script>
(function(){
  var ITER = 200000, KEY = "em-pass";
  var wait = document.getElementById("wait"), gate = document.getElementById("gate"), msg = document.getElementById("msg");
  var norm = function(s){ return String(s || "").trim().toLowerCase(); };
  var fromHash = ""; try { fromHash = norm(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  var stored = ""; try { stored = norm(localStorage.getItem(KEY)); } catch (e) {}
  var inl = document.getElementById("enc");   // single-file variant: the encrypted page is embedded as base64
  var data = inl ? new Promise(function(res){ var s = atob(inl.textContent.replace(/\s+/g, "")), b = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); res(b.buffer); })
                 : fetch("site.enc", { cache: "no-cache" }).then(function(r){ if (!r.ok) throw new Error("load"); return r.arrayBuffer(); });

  function open(pass){
    return data.then(function(buf){
      var b = new Uint8Array(buf), salt = b.slice(0, 16), iv = b.slice(16, 28), body = b.slice(28);
      return crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"])
        .then(function(k){ return crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, k, { name: "AES-GCM", length: 256 }, false, ["decrypt"]); })
        .then(function(k){ return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, body); });
    }).then(function(plain){
      try { localStorage.setItem(KEY, pass); } catch (e) {}
      var anchor = location.hash.slice(1);
      // take the password out of the address bar, so a copied link does not carry it
      if (fromHash === pass){ try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} anchor = ""; }
      var html = new TextDecoder().decode(plain);
      document.open(); document.write(html); document.close();
      if (anchor) setTimeout(function(){ var el = document.getElementById(anchor); if (el) el.scrollIntoView(); }, 60);
    });
  }
  function showGate(text){ wait.hidden = true; gate.hidden = false; msg.textContent = text || ""; }

  if (!(window.crypto && crypto.subtle)){ showGate("This browser cannot open the page. / Dieser Browser kann die Seite nicht öffnen."); return; }
  var tries = []; if (fromHash) tries.push(fromHash); if (stored && stored !== fromHash) tries.push(stored);
  (function next(){
    if (!tries.length){ showGate(""); return; }
    open(tries.shift()).catch(function(e){ if (e && e.message === "load") showGate("The page could not be loaded. Please try again. / Die Seite konnte nicht geladen werden."); else next(); });
  })();

  document.getElementById("f").addEventListener("submit", function(ev){
    ev.preventDefault();
    var pass = norm(document.getElementById("pw").value); if (!pass) return;
    msg.textContent = "…";
    open(pass).catch(function(){ msg.textContent = "That password is not right. / Das Passwort stimmt nicht."; });
  });
})();
</script>
</body>
</html>
